  <text x="57.0" y="620" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#475569">DATA</text>
  <rect x="92" y="605" width="66" height="21" rx="6" ry="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="125.0" y="620" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">SCRIPT</text>
  <rect x="168" y="605" width="90" height="21" rx="6" ry="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="213.0" y="620" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#b45309">CLOUD LLM</text>
  <rect x="268" y="605" width="66" height="21" rx="10.5" ry="10.5" fill="#047857"/>
  <text x="301" y="620" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Verify</text>
  <text x="346" y="620" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Verify = quote check on the fetched page + judge from another model family</text>
</svg>
