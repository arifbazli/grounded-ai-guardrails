<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img">
  <title>Guardrail policy generator</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="32" y="44" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Guardrail policy generator</text>
  <text x="32" y="70" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#334155">scripts/guardrail.py: models propose values; only verified values are marked grounded.</text>
  <rect x="32" y="246" width="700" height="156" rx="16" ry="16" fill="#ecfdf5" stroke="#047857" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="46" y="270" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1" fill="#047857">VERIFY</text>
  <rect x="46" y="100" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <path d="M 58 101 H 234 Q 245 101 245 112 V 130 H 47 V 112 Q 47 101 58 101 Z" fill="#e2e8f0"/>
  <text x="58" y="121" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#475569">1  DATA</text>
  <text x="58" y="154" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">App profile</text>
  <text x="58" y="176" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">sanitized JSON</text>
  <text x="58" y="194" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">+ 70-control catalog</text>
  <rect x="282" y="100" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 294 101 H 470 Q 481 101 481 112 V 130 H 283 V 112 Q 283 101 294 101 Z" fill="#dbeafe"/>
  <text x="294" y="121" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#1d4ed8">2  SCRIPT</text>
  <text x="294" y="154" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Select controls</text>
  <text x="294" y="176" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">select-controls.py</text>
  <rect x="518" y="100" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path d="M 530 101 H 706 Q 717 101 717 112 V 130 H 519 V 112 Q 519 101 530 101 Z" fill="#fde68a"/>
