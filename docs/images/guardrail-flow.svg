  <text x="530" y="154" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Specialists</text>
  <text x="530" y="176" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">7, one per category</text>
  <text x="530" y="194" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">SPECIALIST_MODEL</text>
  <path d="M 249.0 152.0 C 264.0 152.0, 264.0 152.0, 278.0 152.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 485.0 152.0 C 500.0 152.0, 500.0 152.0, 514.0 152.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="46" y="284" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 58 285 H 234 Q 245 285 245 296 V 314 H 47 V 296 Q 47 285 58 285 Z" fill="#dbeafe"/>
  <text x="58" y="305" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#1d4ed8">4  SCRIPT</text>
  <text x="58" y="338" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Value check</text>
  <text x="58" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">type, range, enum</text>
