  <path d="M 294 285 H 470 Q 481 285 481 296 V 314 H 283 V 296 Q 283 285 294 285 Z" fill="#dbeafe"/>
  <text x="294" y="305" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#1d4ed8">5  SCRIPT</text>
  <text x="294" y="338" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Quote check</text>
  <text x="294" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">quote on the page</text>
  <rect x="518" y="284" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path d="M 530 285 H 706 Q 717 285 717 296 V 314 H 519 V 296 Q 519 285 530 285 Z" fill="#fde68a"/>
  <text x="530" y="305" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#b45309">6  CLOUD LLM</text>
  <text x="530" y="338" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Judge</text>
  <text x="530" y="360" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">supported?</text>
  <text x="530" y="378" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">JUDGE_MODEL</text>
