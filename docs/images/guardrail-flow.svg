  <path d="M 485.0 336.0 C 500.0 336.0, 500.0 336.0, 514.0 336.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="46" y="468" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path d="M 58 469 H 234 Q 245 469 245 480 V 498 H 47 V 480 Q 47 469 58 469 Z" fill="#fde68a"/>
  <text x="58" y="489" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#b45309">7  CLOUD LLM</text>
  <text x="58" y="522" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Assembler</text>
  <text x="58" y="544" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">writes tests</text>
  <text x="58" y="562" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">REVIEWER_MODEL</text>
  <rect x="282" y="468" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path d="M 294 469 H 470 Q 481 469 481 480 V 498 H 283 V 480 Q 283 469 294 469 Z" fill="#fde68a"/>
  <text x="294" y="489" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#b45309">8  CLOUD LLM</text>
  <text x="294" y="522" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Reviewer</text>
  <text x="294" y="544" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">findings</text>
  <text x="294" y="562" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">REVIEWER_MODEL</text>
  <rect x="518" y="468" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 530 469 H 706 Q 717 469 717 480 V 498 H 519 V 480 Q 519 469 530 469 Z" fill="#dbeafe"/>
  <text x="530" y="489" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#1d4ed8">9  SCRIPT</text>
  <text x="530" y="522" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Policy check</text>
  <text x="530" y="544" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">check-policy.py</text>
  <rect x="754" y="468" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <path d="M 766 469 H 942 Q 953 469 953 480 V 498 H 755 V 480 Q 755 469 766 469 Z" fill="#e2e8f0"/>
  <text x="766" y="489" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.8" fill="#475569">10  DATA</text>
  <text x="766" y="522" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Policy folder</text>
  <text x="766" y="544" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">policy.json, tests</text>
  <text x="766" y="562" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Bedrock, NeMo</text>
  <path d="M 249.0 520.0 C 264.0 520.0, 264.0 520.0, 278.0 520.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 485.0 520.0 C 500.0 520.0, 500.0 520.0, 514.0 520.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 721.0 520.0 C 736.0 520.0, 736.0 520.0, 750.0 520.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 618.0 207.0 V 243.5 H 146.0 V 280.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 618.0 391.0 V 427.5 H 146.0 V 464.0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
