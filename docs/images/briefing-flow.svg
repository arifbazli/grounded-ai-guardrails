<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img">
  <title>Docs briefing</title>
  <defs>
    <radialGradient id="glow" cx="12%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="290" fill="#0b1020"/>
  <rect x="0" y="0" width="1000" height="290" fill="url(#glow)"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#f1f5f9">Docs briefing</text>
  <text x="40" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">scripts/run.sh: a Prisma Cloud / Cortex Cloud question in, a source-cited briefing out.</text>
  <rect x="50" y="96" width="156" height="124" rx="14" ry="14" fill="#131c3a" stroke="#94a3b8" stroke-opacity="0.65" stroke-width="1.4"/>
  <rect x="64" y="96" width="128" height="3" rx="1.5" ry="1.5" fill="#94a3b8"/>
  <circle cx="74" cy="123" r="11" fill="#94a3b8"/>
  <text x="74" y="127.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0b1020">1</text>
  <rect x="155" y="113" width="39" height="19" rx="9.5" ry="9.5" fill="#94a3b8" fill-opacity="0.16"/>
  <text x="174.5" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.6" fill="#94a3b8">DATA</text>
  <text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Question</text>
  <text x="66" y="178" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">run.sh "..."</text>
  <text x="66" y="194" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">start pages: seeds/</text>
  <rect x="236" y="96" width="156" height="124" rx="14" ry="14" fill="#131c3a" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1.4"/>
  <rect x="250" y="96" width="128" height="3" rx="1.5" ry="1.5" fill="#fbbf24"/>
  <circle cx="260" cy="123" r="11" fill="#fbbf24"/>
