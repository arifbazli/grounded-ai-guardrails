  <text x="438" y="194" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">JUDGE_MODEL</text>
  <rect x="608" y="96" width="156" height="124" rx="14" ry="14" fill="#131c3a" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1.4"/>
  <rect x="622" y="96" width="128" height="3" rx="1.5" ry="1.5" fill="#fbbf24"/>
  <circle cx="632" cy="123" r="11" fill="#fbbf24"/>
  <text x="632" y="127.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0b1020">4</text>
  <rect x="681" y="113" width="71" height="19" rx="9.5" ry="9.5" fill="#fbbf24" fill-opacity="0.16"/>
  <text x="716.5" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.6" fill="#fbbf24">CLOUD LLM</text>
  <text x="624" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Writer</text>
  <text x="624" y="178" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">supported facts only</text>
  <text x="624" y="194" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">WRITER_MODEL</text>
  <rect x="794" y="96" width="156" height="124" rx="14" ry="14" fill="#131c3a" stroke="#94a3b8" stroke-opacity="0.65" stroke-width="1.4"/>
  <rect x="808" y="96" width="128" height="3" rx="1.5" ry="1.5" fill="#94a3b8"/>
  <circle cx="818" cy="123" r="11" fill="#94a3b8"/>
  <text x="818" y="127.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0b1020">5</text>
  <rect x="899" y="113" width="39" height="19" rx="9.5" ry="9.5" fill="#94a3b8" fill-opacity="0.16"/>
  <text x="918.5" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.6" fill="#94a3b8">DATA</text>
  <text x="810" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Briefing</text>
  <text x="810" y="178" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">check-briefing.sh</text>
  <text x="810" y="194" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">outputs/&lt;run&gt;.md</text>
  <path d="M 210 158.0 L 232 158.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 396 158.0 L 418 158.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 582 158.0 L 604 158.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 768 158.0 L 790 158.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="45" cy="264" r="5" fill="#94a3b8"/>
  <text x="56" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">data</text>
  <circle cx="101" cy="264" r="5" fill="#22d3ee"/>
  <text x="112" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">script</text>
  <circle cx="171" cy="264" r="5" fill="#fbbf24"/>
  <text x="182" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">cloud llm</text>
  <circle cx="262" cy="264" r="5" fill="#34d399"/>
  <text x="273" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">script + llm</text>
  <text x="379" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">model setting names (for example JUDGE_MODEL) are shown on each LLM step</text>
