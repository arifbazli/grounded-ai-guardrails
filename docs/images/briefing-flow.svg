  <rect x="309" y="113" width="71" height="19" rx="9.5" ry="9.5" fill="#fbbf24" fill-opacity="0.16"/>
  <text x="344.5" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.6" fill="#fbbf24">CLOUD LLM</text>
