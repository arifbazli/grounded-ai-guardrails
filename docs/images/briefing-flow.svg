  <text x="252" y="194" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">RESEARCH_MODEL</text>
  <rect x="422" y="96" width="156" height="124" rx="14" ry="14" fill="#131c3a" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.4"/>
