  <text x="288" y="528" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#334155">research, write, check</text>
  <rect x="760" y="452" width="200" height="104" rx="12" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
